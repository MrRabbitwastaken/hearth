# Optional: if this folder is pushed to GitHub, every push builds Hearth-Setup.exe automatically.
# Download it from the run's "Artifacts" section.
name: Build Hearth installer
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Hearth-Setup
          path: dist/Hearth-Setup-*.exe
